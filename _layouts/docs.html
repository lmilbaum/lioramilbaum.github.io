<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">

  <!-- Open Graph tags -->
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  {% if page.image %}
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  {% endif %}
  <meta property="og:type" content="website">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #fff;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1a1a1a;
        color: #e0e0e0;
      }
    }

    .page {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      text-align: left;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      color: #0366d6;
      text-decoration: none;
    }

    @media (prefers-color-scheme: dark) {
      .back-link {
        color: #58a6ff;
      }
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .content h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .content h2 {
      font-size: 1.5rem;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }

    .content h2:first-child {
      margin-top: 0;
    }

    .content ul {
      padding-left: 1.5rem;
    }

    .content li {
      margin-bottom: 0.5rem;
    }

    .content a {
      color: #0366d6;
      text-decoration: none;
    }

    @media (prefers-color-scheme: dark) {
      .content a {
        color: #58a6ff;
      }
    }

    .content a:hover {
      text-decoration: underline;
    }

    .content p {
      margin-bottom: 1rem;
    }

    footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid #e1e4e8;
      font-size: 0.875rem;
      color: #666;
    }

    @media (prefers-color-scheme: dark) {
      footer {
        border-top-color: #30363d;
        color: #999;
      }
    }

    /* Shared by both layouts (AGENTS.md rule 4): skip link, focus outline, reduced motion. */
    .skip-link {
      position: absolute;
      top: -10rem;
      left: 0.5rem;
      z-index: 1;
      padding: 0.5rem 1rem;
      background-color: #fff;
      color: #0366d6;
      font-weight: 600;
      text-decoration: none;
    }

    .skip-link:focus {
      top: 0.5rem;
    }

    @media (prefers-color-scheme: dark) {
      .skip-link {
        background-color: #1a1a1a;
        color: #58a6ff;
      }
    }

    :focus-visible {
      outline: 2px solid #0366d6;
      outline-offset: 2px;
    }

    @media (prefers-color-scheme: dark) {
      :focus-visible {
        outline-color: #58a6ff;
      }
    }

    main:focus {
      outline: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
    /* End of the shared block. */
    {%- if page.share_on_linkedin %}

    .share { margin-top: 2rem; }

    .share a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border: 1px solid currentColor;
      border-radius: 6px;
      color: #0366d6;
      font-weight: 600;
      text-decoration: none;
    }

    .share a:hover, .share a:focus-visible { text-decoration: underline; }

    .share svg { width: 16px; height: 16px; fill: currentColor; }

    @media (prefers-color-scheme: dark) {
      .share a { color: #58a6ff; }
    }
    {%- endif %}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
    <a class="back-link" href="{{ '/' | relative_url }}">&larr; Home</a>

    <main id="main" tabindex="-1">
      <section class="content">
        {{ content }}
      </section>

      {%- if page.share_on_linkedin %}
      <p class="share"><a href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn (opens in a new tab)"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854V1.146zm4.943 12.248V6.169H2.542v7.225h2.401zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248-.822 0-1.359.54-1.359 1.248 0 .694.521 1.248 1.327 1.248h.016zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016a5.54 5.54 0 0 1 .016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225h2.4z"/></svg>Share on LinkedIn</a></p>
      {%- endif %}
    </main>

    <footer>&copy; {{ site.time | date: "%Y" }} Liora Milbaum</footer>
  </div>
</body>
</html>
